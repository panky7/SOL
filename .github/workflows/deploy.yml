name: 🛡️ Secure Serverless Deployment

on:
  push:
    branches:
      - main
      - dev

permissions:
  id-token: write   # Required for requesting the JWT OIDC token
  contents: read    # Required for actions/checkout

jobs:
  deploy:
    name: 🚀 Build and Deploy Application
    runs-on: ubuntu-latest
    steps:
      - name: 📂 Checkout Code
        uses: actions/checkout@v4

      - name: 🔍 Determine Environment and Variables
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "ROLE_ARN=${{ secrets.AWS_ROLE_TO_ASSUME }}" >> $GITHUB_ENV
            echo "S3_BUCKET=${{ secrets.AWS_S3_BUCKET_NAME }}" >> $GITHUB_ENV
            echo "CLOUDFRONT_ID=${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }}" >> $GITHUB_ENV
            echo "LAMBDA_NAME=${{ secrets.AWS_LAMBDA_FUNCTION_NAME }}" >> $GITHUB_ENV
          else
            echo "ROLE_ARN=${{ secrets.AWS_ROLE_TO_ASSUME_DEV || secrets.AWS_ROLE_TO_ASSUME }}" >> $GITHUB_ENV
            echo "S3_BUCKET=${{ secrets.AWS_S3_BUCKET_NAME_DEV || secrets.AWS_S3_BUCKET_NAME }}" >> $GITHUB_ENV
            echo "CLOUDFRONT_ID=${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID_DEV || secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }}" >> $GITHUB_ENV
            echo "LAMBDA_NAME=${{ secrets.AWS_LAMBDA_FUNCTION_NAME_DEV || secrets.AWS_LAMBDA_FUNCTION_NAME }}" >> $GITHUB_ENV
          fi

      - name: 🔑 Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION || 'eu-west-3' }}

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 🛠️ Install and Build Frontend
        env:
          REACT_APP_BACKEND_URL: ""
        run: |
          cd frontend
          npm ci --legacy-peer-deps
          CI=false npm run build

      - name: 🚀 Deploy Frontend to Private S3
        run: |
          aws s3 sync frontend/build/ s3://${{ env.S3_BUCKET }} --delete

      - name: ⚡ Invalidate CloudFront Cache
        run: |
          aws cloudfront create-invalidation --distribution-id ${{ env.CLOUDFRONT_ID }} --paths "/*"

      - name: 🟢 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 📦 Package Lambda Function
        run: |
          cd backend
          mkdir -p build_dist
          pip install --target build_dist -r requirements-prod.txt
          cp -r routes build_dist/
          cp server.py build_dist/
          cd build_dist
          zip -q -r ../lambda_function.zip .

      - name: 🚀 Deploy Backend to AWS Lambda
        run: |
          aws lambda update-function-code --function-name ${{ env.LAMBDA_NAME }} --zip-file fileb://backend/lambda_function.zip
